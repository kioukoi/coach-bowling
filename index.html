<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%B3%3C/text%3E%3C/svg%3E">
<title>Coach Bowling</title>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#1b2321;--mute:#66726d;--line:#e2e0d8;--accent:#0f6b5c;--accent-ink:#fff;--warn:#b84a0e;--good:#17803d;--chip:#edf2f0}
@media (prefers-color-scheme:dark){:root{--bg:#111716;--card:#1a2220;--ink:#edf2f0;--mute:#97a39e;--line:#2b3632;--accent:#3fb59f;--accent-ink:#06211c;--warn:#f5a070;--good:#6dd58c;--chip:#222d29}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--navh,66px) + 18px)}
header{padding:10px 16px 2px;display:flex;align-items:baseline;justify-content:space-between}
header h1{font-size:20px;margin:0;letter-spacing:-.2px}
header span{color:var(--mute);font-size:13px}
main{padding:8px 14px 16px;max-width:560px;margin:0 auto}
nav{position:fixed;z-index:100;transform:translateZ(0);left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;color:var(--mute);font:600 13px system-ui,sans-serif;padding:10px 0 12px;cursor:pointer}
nav button svg{display:block;margin:0 auto 2px}
nav button.on{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.card h2{font-size:16px;margin:0 0 8px}
.mute{color:var(--mute)}
.small{font-size:13px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fr{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:center}
.fr.cur{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.fr.ed{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn)}
.fr .n{font-size:11px;color:var(--mute);padding:2px 0}
.fr .rolls{display:flex;justify-content:flex-end;border-bottom:1px solid var(--line)}
.fr .rolls span{flex:1;min-width:0;height:22px;line-height:22px;font-weight:700;font-size:14px;border-left:1px solid var(--line)}
.fr .rolls .spl{display:inline-block;width:20px;height:20px;line-height:16px;box-sizing:border-box;border:2px solid #d32f2f;border-radius:50%;color:#d32f2f;font-style:normal;vertical-align:middle}
.fr .rolls span:first-child{border-left:0}
.fr .cum{font-size:17px;font-weight:700;padding:2px 0;min-height:28px}
.total{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 0}
.total b{font-size:34px;letter-spacing:-1px;line-height:1.1}
.pad{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.pad button,.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;font:700 20px system-ui,sans-serif;height:54px;cursor:pointer}
.pad button:disabled{opacity:.3}
.pad button.x{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pad button.undo{font-size:15px}
.btn{font-size:16px;padding:0 16px;height:48px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn:disabled{opacity:.4}
.link{background:none;border:0;color:var(--mute);font:14px system-ui,sans-serif;text-decoration:underline;padding:8px;cursor:pointer}
.pins{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 0}
.pins div{display:flex;gap:10px}
.pin{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 14px system-ui,sans-serif;cursor:pointer}
.pin.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.tile b{display:block;font-size:22px;letter-spacing:-.5px}
.tile span{font-size:12px;color:var(--mute)}
.bar{height:8px;background:var(--chip);border-radius:4px;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.lab{display:flex;justify-content:space-between;font-size:14px}
.hist{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hist:first-of-type{border-top:0}
.hist b{font-size:20px}
.sug{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:4px}
.sug button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.sug button:last-child{border-bottom:0}.sug small{display:block;color:var(--mute);font-size:12px}
.bdot{cursor:pointer}.bdot.sel{stroke:var(--ink);stroke-width:2}
.dpin{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:var(--card);color:var(--ink);font:700 15px system-ui,sans-serif;cursor:pointer;padding:0}
.dpin.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dpin.gone{display:inline-block;border:2px dashed var(--line);opacity:.35;cursor:default}
.deck{display:flex;flex-direction:column;align-items:center;gap:5px;margin:4px 0 8px}
.deck div{display:flex;gap:8px}
.actrow{display:flex;gap:8px;position:sticky;bottom:calc(var(--navh,66px) + 8px);background:var(--card);box-shadow:0 0 0 6px var(--card);z-index:5}
.okbtn{flex:1;min-width:0;height:58px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);font:800 20px system-ui,sans-serif;cursor:pointer}
.undoB{flex:none;width:64px;height:58px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 26px system-ui,sans-serif;cursor:pointer}.undoB:disabled{opacity:.35}
.strip{display:flex;align-items:center;gap:2px;padding:2px 4px 2px 14px;margin:4px 0}
.strip .sum{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.strip .link{flex:none;padding:10px 7px}
.sticky-t{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -14px;padding:6px 14px 4px}
.scbadge{display:inline-block;min-width:40px;text-align:center;border-radius:10px;padding:3px 8px;font-weight:700;color:#fff;font-size:14px}
.sc-g{background:var(--good)}.sc-m{background:var(--accent)}.sc-w{background:var(--warn)}
.scbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:4px 0 6px}.scbar i{display:block;height:100%}
.sumbtn{background:linear-gradient(135deg,var(--accent),#6a4cff);color:#fff;border:0;font-weight:700}
.sumh{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 2px}
.sumline{font-size:17px;font-weight:600;line-height:1.35}
.ins{border-left:4px solid var(--accent);padding:2px 0 2px 12px;margin:12px 0}
.ins.warn{border-color:var(--warn)}
.ins.good{border-color:var(--good)}
.ins strong{display:block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink);padding:8px 14px;font:600 14px system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:16px system-ui,sans-serif;padding:10px;resize:vertical;min-height:70px}
.ai h3{font-size:15px;margin:14px 0 4px}
.ai ul{margin:4px 0 8px;padding-left:20px}
.ai p{margin:6px 0}
.demo{border-color:var(--warn)}
.who{display:flex;gap:8px;padding:6px 14px 2px;max-width:560px;margin:0 auto;overflow-x:auto}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 16px;font:600 14px system-ui,sans-serif;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.gear{padding:8px 12px;color:var(--mute)}
.duel{width:100%;border-collapse:collapse;text-align:center}
.duel td{padding:7px 4px;border-top:1px solid var(--line)}
.duel td:first-child{text-align:left}
.gt{width:100%;border-collapse:collapse}
.gt td,.gt th{padding:7px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.gt th{font-size:12px;color:var(--mute);font-weight:600;border-top:0}
.vwrap{isolation:isolate;z-index:0;position:relative;background:#000;border-radius:12px;overflow:hidden;touch-action:manipulation}
.vwrap video{display:block;width:100%;height:auto}
.ov{position:absolute;inset:0;pointer-events:none}
.ov svg{position:absolute;inset:0;width:100%;height:100%}
.dot{position:absolute;transform:translate(-50%,-50%);min-width:20px;height:20px;border-radius:50%;font:700 11px/20px system-ui,sans-serif;text-align:center;color:#000}
.dot.c{background:#ffd23f;pointer-events:auto;touch-action:none;cursor:grab;min-width:28px;height:28px;line-height:28px;font-size:12px}
.dot.s{min-width:6px;width:6px;height:6px;background:var(--accent);box-shadow:0 0 0 1px #fff}
.dot.m{background:var(--accent);color:var(--accent-ink)}
.split{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:start}
.sv{margin-bottom:9px}
.sv small{display:block;color:var(--mute);font-size:12px}
.sv b{font-size:17px}
.ctl{display:flex;gap:6px;margin:8px 0}
.ctl button{flex:1;height:44px;font:700 14px system-ui,sans-serif;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
select,input[type=number]{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:8px;font:15px system-ui,sans-serif}
.fileb{display:block;text-align:center;line-height:48px}
.txt{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);padding:10px;font:16px system-ui,sans-serif;margin-bottom:6px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px 20px 16px;color:#fff;background:radial-gradient(120% 90% at 88% 0%,rgba(34,211,182,.55) 0%,rgba(34,211,182,0) 50%),linear-gradient(160deg,#0c3d37 0%,#091210 75%);box-shadow:0 12px 32px rgba(0,0,0,.28);margin:8px 0 4px}
.hero small{opacity:.78;font-size:14px}
.hero .big{font-size:72px;font-weight:800;letter-spacing:-4px;line-height:1;margin-top:4px}
.hero .hs{opacity:.85;font-size:14px}
.hero .hl{font-size:27px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin:8px 0 6px;max-width:80%}
.hero .hp{opacity:.8;margin:0 0 12px;max-width:85%;font-size:14px}
.hero .delta{display:inline-block;padding:2px 9px;border-radius:12px;background:rgba(255,255,255,.16);font-size:12px;font-weight:700;margin-left:6px}
.hero .hbtn{background:#fff;color:#091210;border:0;font-weight:700}
.pinsbg{position:absolute;right:-8px;top:6px;opacity:.13;animation:glow 5s ease-in-out infinite}
@keyframes glow{0%,100%{opacity:.09}50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.pinsbg{animation:none}}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.qt{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px;text-align:left;cursor:pointer;font:inherit;min-height:74px}
.qt b{display:block;font-size:16px}
.qt span{font-size:12px;color:var(--mute)}
.qt.main{grid-column:1/-1;background:var(--accent);color:var(--accent-ink);border:0;box-shadow:0 6px 16px rgba(15,107,92,.3)}
.qt.main span{color:inherit;opacity:.85}
.pills{display:flex;gap:8px;margin-bottom:8px}
.pills .chip{flex:1;padding:10px 4px;text-align:center}
.errbar{background:#b3261e;color:#fff;font:13px system-ui,sans-serif;padding:8px 14px;display:none}
.toast{position:fixed;left:50%;bottom:calc(var(--navh,66px) + 90px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.lnav{display:flex;gap:6px;overflow-x:auto;margin:0 0 12px;padding-bottom:2px}
.lnav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font:600 13px system-ui,sans-serif;cursor:pointer}
.lnav-b{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 8px;font:600 13px system-ui,sans-serif;cursor:pointer}
.lnav-b.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lnav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stp{display:flex;align-items:center;gap:10px;justify-content:space-between;margin:6px 0}
.stp b{font-size:20px;min-width:56px;text-align:center}
.stp button{width:48px;height:42px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:700 18px system-ui,sans-serif;cursor:pointer}
.lane text{font-family:system-ui,sans-serif}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
.kv b{color:var(--accent)}
.stepl{counter-reset:s;list-style:none;padding:0;margin:0}
.stepl li{counter-increment:s;position:relative;padding:9px 0 9px 36px;border-top:1px solid var(--line);font-size:14px;line-height:1.4}
.stepl li:first-child{border-top:0}
.stepl li::before{content:counter(s);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font:700 13px/24px system-ui,sans-serif;text-align:center}
.stepl li b{display:block;margin-bottom:2px}
</style>
</head>
<body>
<header><h1 data-act="go" data-tab="home" style="cursor:pointer">Coach Bowling</h1><span id="sync"></span></header>
<div class="errbar" id="err"></div>
<div class="who" id="who"></div>
<main id="view"></main>
<nav>
  <button data-tab="home"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
  <button data-tab="game"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="9" cy="9" r=".8" fill="currentColor"/><circle cx="13" cy="8.5" r=".8" fill="currentColor"/><circle cx="11" cy="12.5" r=".8" fill="currentColor"/></svg>Partie</button>
  <button data-tab="stats"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
  <button data-tab="coach"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Coach</button>
  <button data-tab="map"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Bowlings</button>
</nav>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
const pct=(a,b)=>b?Math.round(100*a/b):null;
function wilson(c,n){if(!n)return null;const z=1.96,p=c/n,d=1+z*z/n,m=(p+z*z/(2*n))/d,h=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/d;return[Math.max(0,m-h),Math.min(1,m+h)];}
const showPct=v=>v===null?'—':v+' %';

/* ---------- état ---------- */
const LS='bowling-coach-v1';
let state={games:[],current:{r:[],l:{}},settings:{hand:'D'},throws:[],u:0};
const ui={tab:'home',pend:null,sel:[],delId:null,abandon:false,aiText:'',busy:false,question:'',demo:false,gv:null,pm:false,delP:null,hAll:false,sum:false,pad:false,ctxOpen:false,chg:false,goalEdit:false,fm:'all',dw:'m'};
function loadLocal(){for(const k of [LS,LS+'.bak']){try{const s=localStorage.getItem(k);if(!s)continue;const o=JSON.parse(s);if(o&&Array.isArray(o.games)){state=Object.assign(state,o);return;}}catch(e){}}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(state));}catch(e){}}
function saveBak(){try{localStorage.setItem(LS+'.bak',JSON.stringify(state));}catch(e){}}
let dbDoc=null,saveTimer=null;
function persist(cur){ /* cur=true : seule la partie en cours ou un réglage change (pas de synchro, pas de copie de secours) */
  state.u=Date.now();saveLocal();
  if(!cur){saveBak();try{ghSchedule();}catch(e){}}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    if(!dbDoc)return;
    try{await dbDoc.set({json:JSON.stringify(state),u:state.u});$('#sync').textContent='Sauvegardé ✓';}
    catch(e){$('#sync').textContent='';}
  },800);
}
function toast(t,ms){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),ms||2200);}
function setNavH(){try{document.documentElement.style.setProperty('--navh',($('nav').offsetHeight||66)+'px');}catch(e){}}

/* ---------- logique bowling ---------- */
function nextState(r){
  let i=0;
  for(let f=0;f<9;f++){
    if(i>=r.length)return{done:false,frame:f,ball:0,standing:10};
    if(r[i]===10){i++;continue;}
    if(i+1>=r.length)return{done:false,frame:f,ball:1,standing:10-r[i]};
    i+=2;
  }
  const t=r.slice(i);
  if(t.length===0)return{done:false,frame:9,ball:0,standing:10};
  if(t.length===1)return{done:false,frame:9,ball:1,standing:t[0]===10?10:10-t[0]};
  if(t.length===2){
    if(t[0]===10)return{done:false,frame:9,ball:2,standing:t[1]===10?10:10-t[1]};
    if(t[0]+t[1]===10)return{done:false,frame:9,ball:2,standing:10};
  }
  return{done:true,frame:9,ball:3,standing:0};
}
function frameIdx(r){
  const out=[];let i=0;
  for(let f=0;f<9;f++){
    if(i>=r.length){out.push([]);continue;}
    if(r[i]===10){out.push([i]);i++;}
    else{const a=[i];if(i+1<r.length)a.push(i+1);out.push(a);i+=2;}
  }
  out.push(r.map((_,k)=>k).filter(k=>k>=i));
  return out;
}
function score(r){
  const cum=[];let i=0,tot=0,ok=true;
  for(let f=0;f<10;f++){
    let s=null;
    if(f<9){
      if(r[i]===10){if(r[i+1]!==undefined&&r[i+2]!==undefined)s=10+r[i+1]+r[i+2];i+=1;}
      else if(r[i]!==undefined&&r[i+1]!==undefined){
        if(r[i]+r[i+1]===10){if(r[i+2]!==undefined)s=10+r[i+2];}else s=r[i]+r[i+1];
        i+=2;
      }else i+=2;
    }else{
      const t=r.slice(i);
      if(t.length>=3||(t.length===2&&t[0]!==10&&t[0]+t[1]<10))s=t.reduce((a,b)=>a+b,0);
    }
    if(s===null)ok=false;
    if(ok){tot+=s;cum.push(tot);}else cum.push(null);
  }
  const last=cum.filter(v=>v!==null);
  return{cum,total:last.length?last[last.length-1]:0};
}
function standingBefore(r){return r.map((_,k)=>nextState(r.slice(0,k)).standing);}
function sym(p,sb){
  if(sb===10&&p===10)return'X';
  if(sb<10&&p===sb)return'/';
  if(p===0)return'–';
  return String(p);
}
/* Règle USBC : split si la 1 est tombée et qu'une quille manque entre ou juste devant deux quilles restantes. Quilles reliées : en diagonale (devant/derrière) ou l'une derrière l'autre (double wood 1-5, 2-8, 3-9). */

/* ---------- suivi automatique de la boule ---------- */
function lumaFrame(ctx,v,W,H){
  ctx.drawImage(v,0,0,W,H);
  const d=ctx.getImageData(0,0,W,H).data,L=new Uint8Array(W*H);
  for(let i=0,j=0;i<L.length;i++,j+=4)L[i]=(d[j]*0.299+d[j+1]*0.587+d[j+2]*0.114)|0;
  return L;
}
function medianBg(frames){
  const n=frames.length,N=frames[0].length,out=new Uint8Array(N),a=new Array(n);
  for(let i=0;i<N;i++){for(let k=0;k<n;k++)a[k]=frames[k][i];a.sort((x,y)=>x-y);out[i]=a[n>>1];}
  return out;
}
function buildRoi(calib,F,W,H){
  const lane=[[0,0],[1,0],[1,F],[0,F]],Hf=homography(calib,lane),Hi=homography(lane,calib);
  if(!Hf||!Hi)return null;
  const U=new Float32Array(W*H),D=new Float32Array(W*H),M=new Uint8Array(W*H);
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const[u,d]=applyH(Hf,(x+0.5)/W,(y+0.5)/H),i=y*W+x;
    U[i]=u;D[i]=d;if(u>=0&&u<=1&&d>=3&&d<=57)M[i]=1;
  }
  const diam=d=>{const a=applyH(Hi,0,d),b=applyH(Hi,1,d);return Math.hypot((b[0]-a[0])*W,(b[1]-a[1])*H)*0.2048;};
  return{U,D,M,diam,W,H};
}
function findBlobs(L,bg,roi){
  const{W,H,M,D,U,diam}=roi,N=W*H;
  if(!roi.S){const S=[];for(let i=0;i<N;i+=5)if(M[i])S.push(i);roi.S=Int32Array.from(S);}
  const S=roi.S;if(!S.length)return[];
  const ds=new Array(S.length);
  for(let j=0;j<S.length;j++)ds[j]=L[S[j]]-bg[S[j]];
  const srt=ds.slice().sort((a,b)=>a-b),off=srt[srt.length>>1]||0;
  const dev=srt.map(x=>Math.abs(x-off)).sort((a,b)=>a-b),sig=1.4826*(dev[dev.length>>1]||0);
  const thr=Math.max(24,5*sig);
  const fg=new Uint8Array(N);
  for(let i=0;i<N;i++)if(M[i]&&Math.abs(L[i]-bg[i]-off)>thr)fg[i]=1;
  const seen=new Uint8Array(N),q=new Int32Array(N),out=[];
  for(let s=0;s<N;s++){
    if(!fg[s]||seen[s])continue;
    let h=0,t=0,area=0,minx=W,maxx=0,miny=H,maxy=0;
    q[t++]=s;seen[s]=1;
    while(h<t){
      const i=q[h++],x=i%W,y=(i/W)|0;
      area++;if(x<minx)minx=x;if(x>maxx)maxx=x;if(y<miny)miny=y;if(y>maxy)maxy=y;
      if(x>0&&fg[i-1]&&!seen[i-1]){seen[i-1]=1;q[t++]=i-1;}
      if(x<W-1&&fg[i+1]&&!seen[i+1]){seen[i+1]=1;q[t++]=i+1;}
      if(y>0&&fg[i-W]&&!seen[i-W]){seen[i-W]=1;q[t++]=i-W;}
      if(y<H-1&&fg[i+W]&&!seen[i+W]){seen[i+W]=1;q[t++]=i+W;}
    }
    if(area<3)continue;
    const cx=(minx+maxx)/2,ci=Math.min(N-1,maxy*W+Math.round(cx)),d=D[ci],u=U[ci];
    const De=diam(d),w=maxx-minx+1,hh=maxy-miny+1;
    if(!(De>0)||w<0.35*De||w>3*De||hh<0.35*De||hh>3*De)continue;
    out.push({x:(cx+0.5)/W,y:(maxy+1)/H,d,u,area});
  }
  return out;
}
function bestPath(fs){
  const nodes=[];
  fs.forEach((f,k)=>f.c.forEach(c=>nodes.push({k,t:f.t,c,s:1,p:-1,v:0})));
  for(let i=0;i<nodes.length;i++){
    const a=nodes[i];
    for(let j=i-1;j>=0;j--){
      const b=nodes[j],gap=a.k-b.k;
      if(gap>10)break;
      if(gap<1)continue;
      const dt=a.t-b.t,dd=a.c.d-b.c.d;
      if(dt<=0||dd<=0.02)continue;
      const v=dd/dt;if(v<9||v>55)continue;
      const lat=Math.abs(a.c.u-b.c.u)*41.5;
      if(lat>0.6*dd*12+3)continue;
      const sc=b.s+1-0.15*(gap-1)-(b.p>=0?0.02*Math.abs(v-b.v):0)-0.5*lat/(dd*12+1);
      if(sc>a.s){a.s=sc;a.p=j;a.v=v;}
    }
  }
  let bi=-1;
  for(let i=0;i<nodes.length;i++)if(bi<0||nodes[i].s>nodes[bi].s||(nodes[i].s===nodes[bi].s&&nodes[i].c.d>nodes[bi].c.d))bi=i;
  if(bi<0)return[];
  const out=[];
  for(let i=bi;i>=0;i=nodes[i].p)out.push({t:nodes[i].t,x:nodes[i].c.x,y:nodes[i].c.y,d:nodes[i].c.d,u:nodes[i].c.u});
  return out.reverse();
}
function cleanTrack(pts){
  const out=[];
  for(const p of pts){const l=out[out.length-1];if(!l||p.d>l.d+0.2)out.push(p);}
  return out;
}
function seekTo(v,tm){
  return new Promise(res=>{
    if(Math.abs(v.currentTime-tm)<1e-4){res(v.currentTime);return;}
    let sk=false,fr=!v.requestVideoFrameCallback,fin=false,mt=null;
    const done=()=>{if(fin)return;fin=true;v.removeEventListener('seeked',onS);res(mt!==null?mt:v.currentTime);};
    const chk=()=>{if(sk&&fr)done();};
    const onS=()=>{sk=true;setTimeout(()=>{fr=true;chk();},60);chk();};
    v.addEventListener('seeked',onS);
    if(v.requestVideoFrameCallback)v.requestVideoFrameCallback((n,m)=>{fr=true;if(m&&typeof m.mediaTime==='number')mt=m.mediaTime;chk();});
    v.currentTime=Math.max(0,Math.min(tm,(v.duration||tm)-0.001));
    setTimeout(done,2000);
  });
}
function waitMeta(v){
  return new Promise(res=>{
    if(v.readyState>=1){res();return;}
    v.addEventListener('loadedmetadata',()=>res(),{once:true});
    setTimeout(res,8000);
  });
}

async function autoCalib(v,vw,vh,dur){
  const t=ui.t,s=await getSample();if(!s)return false;
  let lim=null;try{lim=await s.limits();}catch(e){}
  if(!lim||!lim.images)return false;
  await seekTo(v,Math.min(0.2,dur/3));
  const sc=768/Math.max(vw,vh),w=Math.max(32,Math.round(vw*sc)),h=Math.max(32,Math.round(vh*sc)),cv=document.createElement('canvas');
  cv.width=w;cv.height=h;cv.getContext('2d').drawImage(v,0,0,w,h);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));if(!blob)return false;
  const prompt='Image d’une piste de bowling filmée depuis derrière le joueur. Repère les 4 coins de la surface de jeu (la piste, gouttières exclues) et donne leurs coordonnées normalisées entre 0 et 1 (x vers la droite, y vers le bas) : p1 = ligne de faute, côté gauche de la piste ; p2 = ligne de faute, côté droit ; p3 = bord droit de la piste à hauteur de la tête de quille (la quille n°1, à 60 pieds de la ligne de faute) ; p4 = bord gauche de la piste à la même hauteur. Gauche et droite = du point de vue du joueur. Réponds uniquement par un objet JSON : {"p1":[x,y],"p2":[x,y],"p3":[x,y],"p4":[x,y]}.';
  const res=await s(prompt,{images:[blob],cache:false});
  const m=((res&&res.text)||'').match(/\{[\s\S]*\}/);if(!m)return false;
  let o;try{o=JSON.parse(m[0]);}catch(e){return false;}
  const P=[o.p1,o.p2,o.p3,o.p4];
  if(!P.every(p=>Array.isArray(p)&&p.length===2&&p.every(n=>typeof n==='number'&&n>=0&&n<=1)))return false;
  const nearW=Math.abs(P[1][0]-P[0][0]),farW=Math.abs(P[2][0]-P[3][0]);
  if(!(P[0][1]>P[3][1]+0.08&&P[1][1]>P[2][1]+0.08&&nearW>0.1&&farW<nearW))return false;
  if(!homography(P,[[0,0],[1,0],[1,t.farFt],[0,t.farFt]]))return false;
  t.calib=P;return true;
}
function autoSlow(){
  const t=ui.t;t.slow=1;t.slowAuto=false;
  const S=throwStats(derivePts(),0);if(!S||S.vFirst===null)return;
  const v=S.vFirst;if(v>=9&&v<=27)return;

}
async function trackBall(v){
  const t=ui.t;t.st='track';t.prog=0;t.err='';render();
  await waitMeta(v);
  const vw=v.videoWidth||640,vh=v.videoHeight||360,dur=v.duration||0;
  if(!(dur>0.3))throw new Error('Vidéo trop courte.');
  const sc=360/Math.max(vw,vh),W=Math.max(32,Math.round(vw*sc)),H=Math.max(32,Math.round(vh*sc));
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  const roi=buildRoi(t.calib,t.farFt,W,H);
  if(!roi)throw new Error('Calage invalide : déplace les 4 points jaunes.');
  const fr=[];
  for(let k=0;k<9;k++){await seekTo(v,dur*(k+0.5)/9);fr.push(lumaFrame(ctx,v,W,H));}
  const bg=medianBg(fr),dt=dur>6?1/30:1/60,n=Math.min(Math.floor(dur/dt),500),fs=[];
  let lastT=-1,maxD=0,lastHit=-99;
  for(let k=0;k<n;k++){
    if(t.cancel)throw new Error('Analyse annulée.');
    const ta=await seekTo(v,k*dt);
    if(Math.abs(ta-lastT)<1e-4)continue;
    lastT=ta;
    const cs=findBlobs(lumaFrame(ctx,v,W,H),bg,roi);
    fs.push({t:ta,c:cs});
    for(const c of cs){if(c.d>maxD)maxD=c.d;if(c.d>10)lastHit=k;}
    if(maxD>=50&&k-lastHit>25)break;
    if(k%4===0){t.prog=k/n;updProg();}
  }
  const tr=cleanTrack(bestPath(fs));
  if(tr.length<6||tr[tr.length-1].d-tr[0].d<15)throw new Error('Boule non détectée. Vérifie que la piste est entière et bien éclairée, ou repère la boule toi-même (réglages avancés).');
  t.marks=tr.map(p=>({t:p.t,x:p.x,y:p.y}));
  autoSlow();
  t.st='done';
}
async function runTrack(){
  const t=ui.t;

async function autoAnalyze(){
  const t=ui.t,v=t.vid;if(!v)return;
  t.cancel=false;t.err='';t.marks=[];t.st='cal';t.prog=0;render();
  try{
    await waitMeta(v);
    const vw=v.videoWidth||640,vh=v.videoHeight||360,dur=v.duration||0;
    if(!(dur>0.3))throw new Error('Vidéo trop courte.');
    if(t.calib.length<4){
      let ok=false;try{ok=await autoCalib(v,vw,vh,dur);}catch(e){ok=false;}
      if(!ok){t.st='tapcal';t.calib=[];render();return;}
    }
    await trackBall(v);
  }catch(e){t.st='fail';t.err=(e&&e.message)||'Analyse impossible.';}
  render();
}

const GHK='bowling-coach-gh',GHFILE='donnees-bowling.json';
const GH={busy:false,again:false,timer:null,st:'',at:0,err:''};
function ghCfg(){try{const o=JSON.parse(localStorage.getItem(GHK)||'null');return o&&o.repo&&o.tok?o:null;}catch(e){return null;}}
function ghSet(o){try{if(o)localStorage.setItem(GHK,JSON.stringify(o));else localStorage.removeItem(GHK);}catch(e){}}
function ghTomb(id){if(!Array.isArray(state.del))state.del=[];if(!state.del.includes(id))state.del.push(id);}
function b64e(t){const b=new TextEncoder().encode(t);let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s);}
function b64d(t){const s=atob(String(t).replace(/\s/g,'')),b=new Uint8Array(s.length);for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);return new TextDecoder().decode(b);}
function ghLocal(){
  return{profiles:state.profiles.map(p=>({id:p.id,name:p.name,games:p.id===state.active?state.games:((p.data&&p.data.games)||[])})),del:Array.isArray(state.del)?state.del:[]};
}
function ghMerge(A,B){
  const del=Array.from(new Set([].concat(A.del||[],B.del||[]))),dels=new Set(del),ts=g=>g.e||g.d||'';
  const out=[],idx={};
  [B,A].forEach(src=>(src.profiles||[]).forEach(p=>{
    let q=idx[p.id];if(!q){q=idx[p.id]={id:p.id,name:p.name,g:{}};out.push(q);}else if(src===A&&p.name)q.name=p.name;
    (p.games||[]).forEach(g=>{if(!g||!g.id||dels.has(g.id))return;const o=q.g[g.id];if(!o||ts(g)>=ts(o))q.g[g.id]=g;});
  }));
  return{profiles:out.map(q=>({id:q.id,name:q.name,games:Object.values(q.g).sort((a,b)=>String(a.d).localeCompare(String(b.d)))})),del};
}
function ghSig(D){return JSON.stringify(D.profiles.map(p=>[p.id,p.name,p.games]))+'|'+D.del.length;}
function ghApply(M){
  const before=ghSig(ghLocal());
  M.profiles.forEach(mp=>{
    let p=state.profiles.find(x=>x.id===mp.id);
    if(!p){p={id:mp.id,name:mp.name,data:null};state.profiles.push(p);}
    if(p.id===state.active)state.games=mp.games;
    else{p.data=p.data||{games:[],current:{r:[],l:{}},settings:{hand:'D'},throws:[]};p.data.games=mp.games;}
  });
  state.del=M.del;
  const changed=ghSig(ghLocal())!==before;
  if(changed){saveLocal();const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))render();else renderWho();}
  return changed;
}
async function ghReq(cfg,method,body){
  const u='https://api.github.com/repos/'+cfg.repo+'/contents/'+GHFILE;
  return fetch(u+(method==='GET'?'?t='+Date.now():''),{method,cache:'no-store',headers:{'Authorization':'Bearer '+cfg.tok,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined});
}
function ghErr(r){
  if(r===0)return'Pas de connexion internet : la synchro reprendra plus tard.';
  if(r===401)return'Clé d’accès refusée ou expirée : crée une nouvelle clé sur GitHub.';
  if(r===403)return'La clé n’a pas le droit d’écrire : coche « Contents : Read and write ».';
  if(r===404)return'Dépôt introuvable : vérifie son nom et que la clé y a accès.';
  return'Erreur GitHub ('+r+').';
}
async function ghSync(manual){
  const cfg=ghCfg();if(!cfg||ui.demo)return;
  if(GH.busy){GH.again=true;return;}
  GH.busy=true;GH.st='busy';ghPaint();
  try{
    for(let tryN=0;tryN<3;tryN++){
      let r;try{r=await ghReq(cfg,'GET');}catch(e){throw{code:0};}
      let remote={profiles:[],del:[]},sha=null;
      if(r.status===200){const j=await r.json();sha=j.sha;try{const o=JSON.parse(b64d(j.content||''));if(o&&Array.isArray(o.profiles))remote=o;}catch(e){}}
      else if(r.status!==404)throw{code:r.status};
      else{let t;try{t=await fetch('https://api.github.com/repos/'+cfg.repo,{cache:'no-store',headers:{'Authorization':'Bearer '+cfg.tok,'Accept':'application/vnd.github+json'}});}catch(e){throw{code:0};}if(!t.ok)throw{code:t.status};}
      const M=ghMerge(ghLocal(),remote);
      ghApply(M);
      if(ghSig(M)===ghSig({profiles:remote.profiles||[],del:remote.del||[]})&&sha)break;
      const payload=JSON.stringify({app:'coach-bowling',v:1,u:new Date().toISOString(),profiles:M.profiles,del:M.del});
      let w;try{w=await ghReq(cfg,'PUT',{message:'Synchro Coach Bowling',content:b64e(payload),sha:sha||undefined});}catch(e){throw{code:0};}
      if(w.ok)break;
      if(w.status===409||w.status===422)continue;
      throw{code:w.status};
    }
    GH.st='ok';GH.at=Date.now();GH.err='';
    if(manual)toast('Synchronisé ✓');
  }catch(e){GH.st='err';GH.err=ghErr(e&&e.code!==undefined?e.code:-1);if(manual)toast(GH.err);}
  finally{GH.busy=false;ghPaint();if(GH.again){GH.again=false;ghSchedule();}}
}
function ghSchedule(){if(!ghCfg())return;clearTimeout(GH.timer);GH.timer=setTimeout(()=>ghSync(false),2500);}
function ghPaint(){
  const s=$('#sync');if(s&&ghCfg())s.textContent=GH.st==='busy'?'Synchro…':GH.st==='ok'?'Synchronisé ✓':GH.st==='err'?'Synchro en attente':'';
  const c=$('#ghstat');if(c)c.innerHTML=ghStat();
}

  if(GH.st==='ok')return'<span class="small" style="color:var(--good)">✓ Synchronisé à '+new Date(GH.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</span>';

  }

    +'<div class="small mute" style="margin-top:8px">Première boule : '+(fb?(fp/fb).toFixed(1):'—')+' quilles en moyenne.</div></div>';
  if(!ui.demo)h+='<div style="text-align:center"><button class="link" data-act="gdel" data-id="'+esc(g.id)+'">'+(ui.delId===g.id?'Confirmer la suppression':'Supprimer cette partie')+'</button></div>';

}

/* ---------- correction d'une frame / d'une partie ---------- */
function feSrc(k){return k==='cur'?state.current:state.games.find(x=>x.id===k);}
function feInfo(){
  const fe=ui.fe,o=feSrc(fe.k);if(!o)return null;
  const fi=frameIdx(o.r),ids=fi[fe.f],start=ids.length?ids[0]:o.r.length;
  const test=o.r.slice(0,start).concat(fe.rolls),ns=nextState(test);
  return{o,ids,start,ns,done:ns.done||ns.frame>fe.f,test};
}
function feOpen(k,f){
  const o=feSrc(k);if(!o)return;
  const ids=frameIdx(o.r)[f],L=o.l||{};
  ui.fe={k,f,rolls:[],l:{},pend:null,sel:[],old:ids.map(i=>o.r[i]),oldL:ids.map(i=>L[i]||null)};
  ui.delId=null;ui.pend=null;ui.sel=[];
}
function feCard(){
  const fe=ui.fe,I=feInfo();if(!I)return'';
  const sbt=standingBefore(I.test).slice(I.start);
  const got=fe.rolls.length?fe.rolls.map((p,j)=>sym(p,sbt[j])).join(' '):'—';
  const was=fe.old.length?fe.old.map((p,j)=>sym(p,standingBefore(I.o.r)[I.start+j])).join(' '):'—';
  let h='<div class="card" style="border-color:var(--warn)"><h2>Corriger la frame '+(fe.f+1)+'</h2><div class="small mute" style="margin-bottom:8px">Avant : <b>'+was+'</b> · nouvelle saisie : <b>'+got+'</b></div>';
  if(fe.pend!==null){
    const need=I.ns.standing;
    const row=a=>'<div>'+a.map(p=>'<button class="pin'+(fe.sel.includes(p)?' on':'')+'" data-act="fe-pin" data-p="'+p+'">'+p+'</button>').join('')+'</div>';
    h+='<div class="small mute">Quilles restées debout ? ('+fe.sel.length+'/'+need+')'+(fe.sel.length===need&&isSplit(fe.sel)?' · <b>split</b>':'')+'</div><div class="pins">'+row([7,8,9,10])+row([4,5,6])+row([2,3])+row([1])+'</div>'
      +'<div class="row2"><button class="btn primary" data-act="fe-leave"'+(fe.sel.length===need?'':' disabled')+'>Valider</button><button class="btn" data-act="fe-skip">Passer</button></div>';
  }else if(!I.done){
    h+='<div class="small mute" style="margin-bottom:6px">Boule '+(fe.rolls.length+1)+' : combien de quilles tombées ?</div><div class="pad">';
    for(let v=0;v<=10;v++){const dis=v>I.ns.standing,last=v===I.ns.standing;h+='<button data-act="fe-roll" data-v="'+v+'"'+(dis?' disabled':'')+(last&&v>0?' class="x"':'')+'>'+(last&&v>0?(I.ns.standing===10?'X':'/'):v)+'</button>';}
    h+='<button class="undo" data-act="fe-back"'+(fe.rolls.length?'':' disabled')+'>↶ Annuler</button></div>';
  }else{
    h+='<button class="btn primary block" data-act="fe-ok">Valider la correction</button>';
  }
  return h+'<div style="text-align:center;margin-top:6px"><button class="link" data-act="fe-cancel">Fermer sans modifier</button></div></div>';
}
function feApply(){
  const fe=ui.fe,I=feInfo();if(!I||!I.done)return;
  const o=I.o,start=I.start,oldEnd=I.ids.length?I.ids[I.ids.length-1]+1:start,n=fe.rolls.length,delta=n-(oldEnd-start);
  const newR=o.r.slice(0,start).concat(fe.rolls,o.r.slice(oldEnd));
  if(fe.k!=='cur'&&!nextState(newR).done){toast('Correction incomplète');return;}
  const L=o.l||{},nl={};
  Object.keys(L).forEach(k=>{k=+k;if(k<start)nl[k]=L[k];else if(k>=oldEnd)nl[k+delta]=L[k];});
  let same=true;
  for(let j=0;j<n;j++){
    same=same&&fe.old[j]===fe.rolls[j];
    if(fe.l[j]!==undefined){if(fe.l[j])nl[start+j]=fe.l[j];}
    else if(same&&fe.oldL[j])nl[start+j]=fe.oldL[j];
  }
  const sb=standingBefore(newR),nr=nextState(newR);
  Object.keys(nl).forEach(k=>{k=+k;const st=sb[k]===10&&newR[k]<10?10-newR[k]:-1;if(!nl[k]||nl[k].length!==st)delete nl[k];});
  if(o.bs)o.bs=o.bs.map(x=>({i:x.i<=start?x.i:x.i>=oldEnd?x.i+delta:Math.min(x.i,start+n),b:x.b}));
  o.r=newR;o.l=nl;
  if(fe.k!=='cur'){o.s=score(newR).total;o.e=new Date().toISOString();}
  ui.fe=null;ui.pend=null;ui.sel=[];persist(fe.k==='cur');render();toast(fe.k==='cur'?'Frame corrigée':'Partie corrigée : '+o.s);
}

const MODES={E:'Entraînement',L:'Ligue',T:'Tournoi'};
function allSrc(){return ui.demo?demoGames():state.games;}
function evName(m){return(state.settings[m==='L'?'evL':'evT']||'');}
function sameDay(a,b){return new Date(a).toDateString()===new Date(b).toDateString();}
function modeInfo(m){
  const w=t=>'<div class="small mute" style="margin-bottom:8px">'+t+'</div>';
  if(m==='E')return w('Partie libre : elle compte dans tes stats d’entraînement.');
  const ev=evName(m).trim();
  if(m==='L'){
    const s=state.games.filter(g=>g.m==='L'&&(g.ev||'')===ev&&sameDay(g.d,Date.now()));

function eventsCard(){

function modeInsights(){
  const a=allSrc(),out=[],g=k=>a.filter(x=>(x.m||'E')===k).map(x=>x.s),E=g('E');

function sparkSVG(v){
  const d=v.slice(-20);if(d.length<2)return'';
  const lo=Math.min(...d),hi=Math.max(...d),W=300,H=56,P=4;
  const x=i=>P+(W-2*P)*i/(d.length-1),y=t=>H-P-(H-2*P)*(t-lo)/((hi-lo)||1);
  const pts=d.map((t,i)=>x(i).toFixed(1)+','+y(t).toFixed(1)).join(' ');
  return'<svg viewBox="0 0 300 56" width="100%" height="56" preserveAspectRatio="none" style="margin-top:10px;display:block" role="img" aria-label="Évolution de tes derniers scores"><polygon points="'+P+','+H+' '+pts+' '+(W-P)+','+H+'" fill="rgba(255,255,255,.14)"/><polyline points="'+pts+'" fill="none" stroke="#fff" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

async function photoBlob(file,max){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ko(new Error('image'));i.src=url;});
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(32,Math.round(img.naturalWidth*sc)),h=Math.max(32,Math.round(img.naturalHeight*sc));
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
    return await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
  }finally{URL.revokeObjectURL(url);}
}

    const res=await sm(prompt,{images:[blob],cache:false});

function mountMap(){
  const svg=$('#mapsvg');if(!svg)return;
  mapClamp();mapPaint();
  const P=new Map();let moved=0,t0=0,last=null;
  const pt=e=>{const r=svg.getBoundingClientRect();return[(e.clientX-r.left)*MW/r.width,(e.clientY-r.top)*MH/r.height];};
  const zoomAt=(x,y,f)=>{const v=ui.mv,ns=Math.max(1,Math.min(60,v.s*f)),k=ns/v.s;v.tx=x-(x-v.tx)*k;v.ty=y-(y-v.ty)*k;v.s=ns;mapClamp();mapPaint();};
  svg.addEventListener('pointerdown',e=>{svg.setPointerCapture(e.pointerId);P.set(e.pointerId,pt(e));moved=0;t0=Date.now();last=null;});
  svg.addEventListener('pointermove',e=>{
    if(!P.has(e.pointerId))return;
    const o=P.get(e.pointerId),n=pt(e);
    if(P.size===1){ui.mv.tx+=n[0]-o[0];ui.mv.ty+=n[1]-o[1];moved+=Math.abs(n[0]-o[0])+Math.abs(n[1]-o[1]);P.set(e.pointerId,n);mapClamp();mapPaint();}
    else if(P.size===2){
      const ids=[...P.keys()],a=P.get(ids[0]),b=P.get(ids[1]);
      const d0=Math.hypot(a[0]-b[0],a[1]-b[1]);P.set(e.pointerId,n);
      const a2=P.get(ids[0]),b2=P.get(ids[1]),d1=Math.hypot(a2[0]-b2[0],a2[1]-b2[1]);
      if(d0>0)zoomAt((a2[0]+b2[0])/2,(a2[1]+b2[1])/2,d1/d0);
      moved+=10;
    }
  });
  const up=e=>{
    const was=P.size;const p=P.get(e.pointerId);P.delete(e.pointerId);
    if(was===1&&moved<8&&Date.now()-t0<500&&p){
      let best=null,bd=22;
      BOW.forEach(b=>{if(b.dom||!mapMatch(b))return;const q=mapScr(b),d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<bd){bd=d;best=b;}});
      ui.msel=best?best.i:null;mapPaint();const m=$('#msel');if(m)m.innerHTML=mapSelHTML();
    }
  };
  svg.addEventListener('pointerup',up);svg.addEventListener('pointercancel',e=>{P.delete(e.pointerId);});
  svg.addEventListener('wheel',e=>{e.preventDefault();const p=pt(e);zoomAt(p[0],p[1],e.deltaY<0?1.25:0.8);},{passive:false});
}

/* ---------- animation de la boule ---------- */
let lnAnimRaf=0,lnAnimGen=0;
function lnAnimStop(){lnAnimGen++;if(lnAnimRaf)cancelAnimationFrame(lnAnimRaf);lnAnimRaf=0;}
function lnMount(force){
  lnAnimStop();
  const svg=document.querySelector('svg.lane[data-anim]');if(!svg)return;
  let reduce=false;try{reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){}
  if(reduce)return;
  const path=svg.querySelector('#lp0'),ball=svg.querySelector('#ballG');if(!path||!ball)return;
  const Y0=+svg.dataset.y0,HF=+svg.dataset.hf,F=+svg.dataset.f,len=path.getTotalLength();
  const pins=[...svg.querySelectorAll('.pnG')].map(g=>({g,x:+g.dataset.bx,y:+g.dataset.by,k:+g.dataset.k}));
  const rv=[...svg.querySelectorAll('.rv')],lah=svg.querySelector('#lah');
  const end=path.getPointAtLength(len),gen=lnAnimGen,T=2400,FALL=700,HOLD=1100;
  const total=T+500+FALL+HOLD;let t0=0,loops=0;
  const setBall=p=>{const pt=path.getPointAtLength(len*p),k=F*(pt.y-Y0)/HF,r=.22*Math.max(k,8);ball.setAttribute('transform','translate('+pt.x.toFixed(1)+','+pt.y.toFixed(1)+') scale('+r.toFixed(2)+')');};
  const reset=()=>{pins.forEach(o=>{o.g.removeAttribute('transform');o.g.setAttribute('opacity',1);});rv.forEach(e=>{e.style.strokeDasharray=len;e.style.strokeDashoffset=len;});if(lah)lah.setAttribute('opacity',0);ball.setAttribute('opacity',1);};
  const frame=ts=>{
    if(gen!==lnAnimGen||!document.body.contains(svg))return;
    if(!t0)t0=ts;const t=ts-t0;
    if(t<T){const e=t/T,p=e*e*(3-2*e)*.35+e*.65;setBall(p);rv.forEach(x=>{x.style.strokeDashoffset=len*(1-p);});}
    else{
      setBall(1);rv.forEach(x=>{x.style.strokeDashoffset=0;});
      const tf=t-T-500;
      pins.forEach(o=>{
        const dist=Math.abs(o.x-end.x)/80,delay=dist*320,q=Math.max(0,Math.min(1,(tf-delay)/FALL));
        if(q<=0){return;}
        const e=q*q,dir=o.x<end.x?-1:(o.x>end.x?1:(o.y<end.y?1:-1)),ang=dir*(78*e),dx=dir*o.k*.9*e,dy=-o.k*.55*e;
        o.g.setAttribute('transform','translate('+dx.toFixed(1)+','+dy.toFixed(1)+') rotate('+ang.toFixed(1)+','+o.x+','+o.y+')');
        o.g.setAttribute('opacity',(1-Math.max(0,(q-.6)/.4)).toFixed(2));
      });
      if(tf>FALL*.5)ball.setAttribute('opacity',Math.max(0,1-(tf-FALL*.5)/500).toFixed(2));
    }
    if(t>=total){loops++;if(loops>=3){reset();pins.forEach(o=>{o.g.setAttribute('opacity',1);});setBall(0);rv.forEach(e=>{e.style.strokeDashoffset=0;});if(lah)lah.setAttribute('opacity',1);ball.setAttribute('opacity',1);return;}t0=0;reset();setBall(0);}
    lnAnimRaf=requestAnimationFrame(frame);
  };
  reset();setBall(0);lnAnimRaf=requestAnimationFrame(frame);
}

function spareCalc(pins){

  }else if(act==='vstep'){
    stepFrames(+b.dataset.n);
  }else if(act==='tsample'){
    ui.t=newT();ui.t.sample=true;ui.aiThrow='';render();
  }else if(act==='texit'){
    ui.t=newT();ui.aiThrow='';render();
  }else if(act==='tclear'){
    ui.t.calib=[];ui.t.marks=[];ui.t.st='tapcal';ui.t.manual=false;render();
  }else if(act==='tmanual'){
    ui.t.manual=true;render();
  }else if(act==='trerun'){
    if(ui.t.calib.length===4)runTrack();else autoAnalyze();
  }else if(act==='tcancel'){
    ui.t.cancel=true;
  }else if(act==='tundo'){
    ui.t.marks.pop();render();
  }else if(act==='tsave'){
    if(ui.demo){toast('Désactivé en mode démo');return;}
    const S=throwStats(derivePts(),+ui.t.turns);
    if(S){
      const r1=v=>v===null||v===undefined?null:Math.round(v*10)/10;
      state.throws.push({id:Date.now().toString(36),d:new Date().toISOString(),vf:r1(S.vFirst),vl:r1(S.vLast),ar:r1(S.arrow),bk:S.brk?r1(S.brk.b):null,bkd:S.brk?r1(S.brk.d):null,en:r1(S.entry),an:r1(S.angle),rpm:r1(S.rpm),sc:(throwScore(metricsOfS(S),state.throws)||{}).total});
      persist();render();toast('Lancer enregistré');
    }
  }else if(act==='tdel'){
    if(ui.delT===b.dataset.id){state.throws=state.throws.filter(x=>x.id!==b.dataset.id);ui.delT=null;persist();}else ui.delT=b.dataset.id;
    render();
  }else if(act==='tai'){
    askThrow();
  }else if(act.startsWith('ln-')||act==='ct'||act==='drill-log'){
    lnAct(act,b);
  }else if(act==='hand'){
    state.settings.hand=b.dataset.h;persist();render();
  }else if(act==='plan'){
    askCoach('Fais-moi un diagnostic en 3 points maximum (avec les chiffres), puis un plan d’entraînement de 2 semaines en 3 séances de 45 minutes maximum avec des exercices concrets, puis un conseil mental.');
  }else if(act==='ask'){
    const q=($('#q')||{}).value||'';ui.question=q;
    if(!q.trim()){toast('Écris ta question d’abord');return;}
    askCoach('Question du joueur : '+q.trim());
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='q')ui.question=e.target.value;
  else if(e.target.id==='ctxc'||e.target.id==='ctxb'){const k=e.target.id==='ctxc'?'c':'b';ctxOf()[k]=e.target.value.slice(0,60);persist(true);showSug(k,e.target.value);}
  else if(e.target.id==='chgb')showSug('x',e.target.value);
  else if(e.target.id==='mq'){ui.mq=e.target.value;ui.msel=null;mapPaint();const l=$('#mlist');if(l)l.innerHTML=mapListHTML();const m=$('#msel');if(m)m.innerHTML=mapSelHTML();}
  else if(e.target.id==='ev'){state.settings[(state.settings.mode==='L')?'evL':'evT']=e.target.value;persist(true);}
});
document.addEventListener('focusin',e=>{
  if(e.target.id==='ctxc')showSug('c',e.target.value);else if(e.target.id==='ctxb')showSug('b',e.target.value);else if(e.target.id==='chgb')showSug('x',e.target.value);
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='ctxw'){ctxOf().w=el.value?+el.value:'';persist(true);render();}
  else if(el.id==='fmsel'){ui.fm=el.value;ui.hAll=false;render();}
  else if(el.id==='fpsel'){ui.fp=el.value;ui.hAll=false;render();}
  else if(el.id==='gctxw'){const g=state.games.find(x=>x.id===ui.gv);if(g){g.e=new Date().toISOString();g.ctx=g.ctx||{};if(el.value)g.ctx.w=+el.value;else delete g.ctx.w;persist();render();toast('Partie modifiée');}}
  else if(el.id==='gctxc'){const g=state.games.find(x=>x.id===ui.gv);if(g){g.e=new Date().toISOString();const v=el.value.trim().slice(0,60);g.ctx=g.ctx||{};if(v)g.ctx.c=v;else delete g.ctx.c;persist();render();toast('Partie modifiée');}}
  else if(el.id==='gev'){const g=state.games.find(x=>x.id===ui.gv);if(g){g.e=new Date().toISOString();g.ev=el.value.trim().slice(0,30);persist();render();toast('Partie modifiée');}}
  else if(el.id==='ballfile'){if(el.files&&el.files[0]){identifyBall(el.files[0]);el.value='';}}
  else if(el.id==='vfile'){if(el.files&&el.files[0]){loadVideo(el.files[0]);el.value='';}}
  else if(el.id==='fps'){ui.t.fps=+el.value;render();}
  else if(el.id==='slow'){ui.t.slow=+el.value;render();}
  else if(el.id==='turns'){ui.t.turns=el.value;render();}
  else if(el.classList&&el.classList.contains('pn')){
    const pr=state.profiles.find(x=>x.id===el.dataset.id),v=el.value.trim();
    if(pr&&v){pr.name=v.slice(0,16);persist();renderWho();}
  }
});

window.addEventListener('error',ev=>{try{const el=$('#err');el.style.display='block';el.textContent='Erreur : '+(ev.message||'inconnue');}catch(x){}});
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>goTab(b.dataset.tab)));
loadLocal();ensureProfiles();setNavH();render();ghInit();
window.addEventListener('resize',setNavH);
document.addEventListener('visibilitychange',()=>{wlSync();});
setInterval(wlSync,60000);
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
getSample().then(()=>{if(ui.tab==='coach')render();});
(async()=>{
  try{
    if(!window.claude)return;
    const[db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    const doc=db.collection('data/users/'+id).doc('bowling');
    let snap=null;try{snap=await doc.get();}catch(e){}
    let data=snap&&(typeof snap.data==='function'?snap.data():snap);
    dbDoc=doc;
    if(data&&data.json){
      try{
        const remote=JSON.parse(data.json);
        if(remote&&Array.isArray(remote.games)&&(remote.u||0)>(state.u||0)){state=Object.assign({games:[],current:{r:[],l:{}},settings:{hand:'D'},throws:[],u:0},remote);ensureProfiles();saveLocal();render();$('#sync').textContent='Sauvegardé ✓';return;}
      }catch(e){}
    }
    if(state.games.length||state.current.r.length)persist();
  }catch(e){}
})();
</script>
